<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تفصيلة | تصاميم دعوات إلكترونية للأفراح والمناسبات</title>
<meta name="description" content="اختر تصميم دعوتك الإلكترونية لحفل الزفاف أو الإشهار أو التخرج أو عيد الميلاد، ونحن نجهزها لك.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#f7f1e8;--card:#fffdf9;--ink:#30272c;--mut:#6b5d64;--gold:#4a263d;--g2:#b99a68;--line:#e3d6c8;--soft:#efe5da;--rose:#d7b5b3;--bi:#f7f1e8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1a25;--card:#37222f;--ink:#f7f1e8;--mut:#d7b5b3;--gold:#d7b5b3;--line:#5a3a4d;--soft:#33202c;--bi:#2b1a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b1a25;--card:#37222f;--ink:#f7f1e8;--mut:#d7b5b3;--gold:#d7b5b3;--line:#5a3a4d;--soft:#33202c;--bi:#2b1a25;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 "IBM Plex Sans Arabic",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.w{max-width:1080px;margin:0 auto;padding:0 18px}
h1,h2{font-family:"IBM Plex Sans Arabic","IBM Plex Sans Arabic",serif;font-weight:500;margin:0}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .w{display:flex;align-items:center;gap:6px;height:62px;overflow-x:auto;white-space:nowrap}
.logo{font:500 26px "IBM Plex Sans Arabic",serif;color:var(--gold);margin-inline-end:auto;text-decoration:none}
.nav a.l{color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:10px;font-size:16px}
.nav a.l:hover{background:var(--soft)}
.hero{text-align:center;padding:64px 0 40px;background:var(--bg)}
.slg{font:400 clamp(18px,4vw,24px) "IBM Plex Sans Arabic",serif;color:var(--ink);margin-top:2px}
.hero h1{font-size:clamp(34px,8vw,48px);color:var(--gold);line-height:1.4}
.hero p{max-width:520px;margin:10px auto 22px;color:var(--mut)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px;color:var(--mut);font-size:15px}
.chips span{border:1px solid var(--line);border-radius:10px;padding:2px 12px;background:var(--card)}
.btn{display:inline-block;font:600 16px "IBM Plex Sans Arabic",sans-serif;padding:8px 20px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:var(--bi);text-decoration:none;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn.alt{background:transparent;color:var(--gold)}.btn.sm{padding:4px 14px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
section{padding:44px 0}
h2{font-size:32px;color:var(--gold);text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.tab{font:600 15px "IBM Plex Sans Arabic",sans-serif;padding:6px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--tc,var(--gold));border-color:var(--tc,var(--gold));color:var(--tcc,var(--bi))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .3s,box-shadow .3s}
.dc:hover{transform:translateY(-5px);box-shadow:0 12px 28px #4a263d22}
.pv{position:relative;height:250px;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.mk{background:#ffffffd9;color:#3a3426;border-radius:12px;padding:18px 22px;text-align:center;line-height:1.5;font-size:30px}
.mk b{display:block;font:500 22px "IBM Plex Sans Arabic",serif}.mk small{font-size:13px;color:#7a7160}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:#ffffffe6;color:#3a3426;font-size:12px;padding:0 10px;border-radius:10px}
.in{padding:12px 14px 14px}.in h3{margin:0 0 8px;font-size:17px}.ac{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);grid-column:1/-1}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;align-items:stretch}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px}
.pc.hot{border:2px solid var(--g2);box-shadow:0 8px 24px #4a263d22}
.pn{font:500 24px "IBM Plex Sans Arabic",serif;color:var(--gold)}.pp{font-size:34px;font-weight:700}
.pf{text-align:right;flex:1;color:var(--mut);margin:6px 0}.pf div::before{content:"✓ ";color:var(--g2);font-weight:700}
.edit [contenteditable]{outline:2px dashed var(--g2);border-radius:6px;min-height:1.5em}
.dm{display:flex;justify-content:center;gap:22px;margin-top:30px}.dm i{width:12px;height:12px;background:var(--rose);transform:rotate(45deg);border-radius:2px;display:block}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
footer{text-align:center;padding:36px 18px;background:var(--soft);border-top:1px solid var(--line);color:var(--mut)}
dialog{border:1px solid var(--g2);border-radius:16px;background:var(--bg);color:var(--ink);width:min(92vw,420px);padding:22px;font:inherit}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 2px;font-size:15px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#bar{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));inset-inline-start:12px;z-index:70;display:flex;gap:8px}
#adm{background:var(--soft);border:1px dashed var(--g2);border-radius:14px;padding:16px;margin-bottom:24px}
#adm .f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.x{display:none}.edit .x{display:inline-block}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}

.lg{display:block;aspect-ratio:900/283;background:var(--gold);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo .lg{height:34px}
.lg.big{width:min(72vw,330px);margin:0 auto 14px;background:linear-gradient(100deg,var(--gold) 35%,var(--g2) 50%,var(--gold) 65%);background-size:260% 100%}
#pg{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--g2),var(--gold));transform-origin:right;transform:scaleX(0);z-index:80}
.nav{background:var(--bg);transition:box-shadow .3s}
.nav.sc{box-shadow:0 6px 24px #4a263d1f}
.nav a.l{position:relative}.nav a.l::after{content:"";position:absolute;inset-inline:14px;bottom:2px;height:2px;background:var(--g2);transform:scaleX(0);transition:transform .3s}.nav a.l:hover::after{transform:scaleX(1)}
.hero{position:relative;overflow:hidden;background:radial-gradient(700px 320px at 12% 0,#d7b5b366,transparent 70%),radial-gradient(620px 300px at 92% 30%,#b99a6844,transparent 70%),var(--bg)}
.hero::before,.hero::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(60px);opacity:.45}
.hero::before{background:#d7b5b3;top:-90px;right:-60px}.hero::after{background:#b99a68;bottom:-120px;left:-70px;animation-delay:-6s}
.hero .w{position:relative;z-index:1}.hero .w>*{animation:up .9s ease both}
.hero .w>*:nth-child(2){animation-delay:.12s}.hero .w>*:nth-child(3){animation-delay:.24s}.hero .w>*:nth-child(4){animation-delay:.36s}.hero .w>*:nth-child(5){animation-delay:.48s}.hero .w>*:nth-child(6){animation-delay:.6s}.hero .w>*:nth-child(7){animation-delay:.72s}
.hero h1{background:linear-gradient(90deg,var(--gold),#8a5373 50%,var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:6px}
h2::after{content:"◆ ◆ ◆";display:block;margin:8px auto 0;font-size:9px;letter-spacing:8px;color:var(--g2)}
.dc{animation:up .7s ease both;animation-delay:calc(var(--i,0)*80ms)}
.pv::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,#ffffff66 50%,transparent 62%);transform:translateX(-130%);transition:transform .9s}.dc:hover .pv::after{transform:translateX(130%)}
.pc{transition:transform .3s,box-shadow .3s}.pc:hover{transform:translateY(-4px);box-shadow:0 14px 30px #4a263d1f}
.pc.hot{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--g2),var(--rose),var(--gold)) border-box;border:2px solid transparent}
.pp{background:linear-gradient(90deg,var(--gold),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mk .lg{height:15px;margin:10px auto 0;opacity:.55}
#packages{background:linear-gradient(180deg,var(--bg),var(--soft) 50%,var(--bg))}
.w.cta{width:calc(100% - 28px);max-width:1040px;border-radius:22px;padding:52px 18px;color:#f7f1e8;background:radial-gradient(500px 220px at 85% 0,#d7b5b340,transparent 70%),linear-gradient(135deg,#4a263d,#2b1a25)}
.cta h2{color:#f7f1e8}.cta .sub{color:#d7b5b3}.cta .btn{background:#f7f1e8;color:#4a263d;border-color:#f7f1e8}
footer{background:linear-gradient(160deg,#4a263d,#2b1a25);color:#d7b5b3;border:0;padding:48px 18px}
footer .lg{height:58px;margin:0 auto 10px;background:#f7f1e8}.ftt{font-size:20px;color:#f7f1e8}footer .dm i{background:#ffffff22}.cp{font-size:14px;margin-top:6px}
dialog .lg{height:30px;margin:0 auto 6px}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-260% 0}}
@keyframes drift{to{transform:translate(40px,30px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}#pg{display:none}}
/* ===== react sections ===== */
.boot{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);text-align:center;padding:0 18px}
.rev{opacity:0;transform:translateY(34px)}
.rev.in{opacity:1;transform:none;transition:opacity .7s ease,transform .7s ease}
.cw{height:100%}.dc{animation:none}.pcw{display:flex}.pcw .pc{flex:1;width:100%}
.eb{text-align:center;font-size:13px;letter-spacing:.16em;color:var(--mut);margin-bottom:2px}.sh{margin-bottom:10px}
.nav a.l.act{color:var(--gold)}.nav a.l.act::after{transform:scaleX(1)}
.rail{position:fixed;inset-inline-end:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px;z-index:55}
.rail a{width:10px;height:10px;border:1.5px solid var(--g2);border-radius:2px;transform:rotate(45deg);transition:all .35s}
.rail a.act{background:var(--gold);border-color:var(--gold);transform:rotate(45deg) scale(1.35)}
@media(max-width:760px){.rail{display:none}}
.pc input,.pc textarea{text-align:center;margin:3px 0}
@media(prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;filter:none}}
</style>
